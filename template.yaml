AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WorkLoop Serverless Backend

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WorkLoopJobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: jobId, AttributeType: S }]
      KeySchema: [{ AttributeName: jobId, KeyType: HASH }]

  WorkersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WorkLoopWorkers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: workerId, AttributeType: S }]
      KeySchema: [{ AttributeName: workerId, KeyType: HASH }]

  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WorkLoopRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: requestId, AttributeType: S }]
      KeySchema: [{ AttributeName: requestId, KeyType: HASH }]

  VerificationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "workloop-kyc-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
